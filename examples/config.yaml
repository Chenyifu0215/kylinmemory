# Copy to <data-directory>/config.yaml. Put secrets in OPENAI_API_KEY.
model:
  provider: custom
  model: your-competition-model
  base_url: https://your-inference-service.example/v1
  api_mode: chat_completions
  api_key_env: OPENAI_API_KEY

auxiliary:
  atom_memory:
    provider: auto
    model: ""

memory:
  atom:
    enabled: true
    prompt_mode: chat
    every_n_conversations: 3
    enable_warmup: true
    embedding:
      mode: remote
      model: qwen-embedding
      dimensions: auto
      base_url: http://127.0.0.1:18080/v1/infer
      api_key_env: ""
user_profile:
  enabled: true
