[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "kylinmemory"
version = "0.2.0"
description = "Standalone L0/L1/L2/L3 memory pipeline extracted from Kylin Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "openai>=2.24,<3",
  "httpx[socks]>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "cryptography>=45.0.7,<47",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.2,<2",
  "sqlite-vec==0.1.6",
]

[project.urls]
Repository = "https://github.com/Chenyifu0215/kylinmemory"

[project.optional-dependencies]
anthropic = ["anthropic>=0.86,<0.88"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.3,<2", "build>=1.2,<2", "anthropic>=0.86,<0.88"]

[project.scripts]
kylinmemory = "kylin_memory.cli:main"
kylinmemory-profile = "kylin_memory.user_profile.cli:main"

[project.entry-points."kylin_memory.providers"]
layered = "kylin_memory.runtime:MemorySystem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kylin_memory = ["defaults.json", "plugin_template/*"]
"kylin_memory._vendor" = ["plugins/model-providers/*/*.py", "plugins/model-providers/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
