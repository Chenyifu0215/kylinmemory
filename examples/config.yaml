# Copy to <data-directory>/config.yaml. Put secrets in OPENAI_API_KEY.
model:
  provider: custom
  model: your-competition-model
  # chat_completions 模式只填域名时自动补 /v1；已有路径保持原样
  base_url: https://your-inference-service.example/v1
  api_mode: chat_completions
  api_key_env: OPENAI_API_KEY

auxiliary:
  atom_memory:
    provider: auto
    model: ""

memory:
  atom:
    enabled: true
    prompt_mode: chat
    every_n_conversations: 3
    enable_warmup: true
    embedding:
      mode: remote
      model: your-competition-model
      dimensions: auto  # 根据返回向量长度自动识别，不修改模型输出维度
      # 支持 API 基础地址（自动追加 /embeddings）或完整 /v1/embeddings 地址
      base_url: https://your-inference-service.example/v1
      api_key_env: OPENAI_API_KEY
user_profile:
  enabled: true
